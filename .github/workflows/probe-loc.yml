name: Probe Kiwoom LOC order (one-off, SOXL 1주 접수→즉시 취소)

# 2026-10-13 인선 허락: 키움 모의(해외)에서 LOC(trde_tp=30) 주문이 접수되는지 한 번만 시험한다.
# SOXL 1주를 현재가의 절반 가격으로 LOC 매수 → 접수 확인 → 바로 취소. 체결될 수 없는 가격이라
# 돈은 나가지 않는다. PC가 꺼져 있어도 돌도록 클라우드에서 실행하고 결과를 텔레그램으로 보낸다.
# GitHub schedule은 늦게 올 수 있어서 두 번 걸어 두고, 이미 한 번 성공했으면 두 번째는 건너뛴다.
# 시험이 끝나면 이 파일은 지운다.

on:
  schedule:
    - cron: "40 13 13 10 *"   # 2026-10-13 22:40 KST (미국장 시작 10분 뒤)
    - cron: "40 15 13 10 *"   # 2026-10-14 00:40 KST (첫 번째가 안 왔을 때 대비)
  workflow_dispatch:

concurrency:
  group: probe-loc
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow probe-loc.yml --status success --limit 5 --json databaseId --jq 'length' || echo 0)
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 성공한 시험이 있어 건너뜁니다."; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - if: steps.gate.outputs.skip != 'true'
        name: LOC probe
        env:
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
        run: python -u probe_kiwoom_loc.py 2>&1 | tee probe_result.txt

      - if: steps.gate.outputs.skip != 'true' && always()
        name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          try:
              body = open("probe_result.txt", encoding="utf-8").read()
          except FileNotFoundError:
              body = "(결과 파일 없음 — 로그 확인 필요)"
          text = "🧪 키움 LOC 주문 시험 (SOXL 1주, 바로 취소)\n\n" + body
          r = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                            json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[:4000]}, timeout=20)
          r.raise_for_status()
          PY
