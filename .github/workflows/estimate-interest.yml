name: FABOT 추정 현금 이자 기록 (매일, RP 일 단위)

# 모의계좌는 예수금(현금)에 이자가 안 붙는다 — 그래서 연 3%(RP 가정)를 하루 단위로 계산해
# trades 테이블에 "현금흐름(이자)"로 기록한다(2026-11-04 인선 요청: 매달 5일 한 달치 → 매일 하루치).
# 마지막 기록 다음 날부터 어제(한국 날짜)까지 그날 끝의 장부 현금 × 3% ÷ 365 를 더해 한 줄로 남긴다.
# 계좌: 한투 v2(원화·달러 칸), 키움 국내포트(원화), KIS 모의투자(한투 원화 중 v2 밖 나머지).
# 매일 도는 작업이라 텔레그램은 실패했을 때만 보낸다.

on:
  schedule:
    - cron: "10 0 * * *"  # 매일 00:10 UTC = 09:10 KST
  workflow_dispatch: {}

jobs:
  interest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Kiwoom token cache
        uses: actions/cache/restore@v4
        with:
          path: .kiwoom_token_cache_demo_domestic.json
          key: kiwoom-domestic-token-${{ github.run_id }}
          restore-keys: |
            kiwoom-domestic-token-

      - name: Estimate and log cash interest (KIS + Kiwoom)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_STOCK: ${{ secrets.KIS_PAPER_STOCK }}
          KIWOOM_PAPER_APP_KEY: ${{ secrets.KIWOOM_PAPER_APP_KEY }}
          KIWOOM_PAPER_APP_SECRET: ${{ secrets.KIWOOM_PAPER_APP_SECRET }}
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
        run: |
          set -o pipefail
          python estimate_interest.py 2>&1 | tee interest_result.txt

      - name: Save Kiwoom token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kiwoom_token_cache_demo_domestic.json
          key: kiwoom-domestic-token-${{ github.run_id }}

      - name: Notify Telegram (실패했을 때만)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          {
            echo "🏦 FABOT 추정 현금 이자 기록 ($(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST)"
            echo ""
            cat interest_result.txt
          } > telegram_message.txt

          python - <<'PY'
          import os
          import requests

          with open("telegram_message.txt", encoding="utf-8") as f:
              text = f.read()

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          resp = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": text[:4000]},
              timeout=20,
          )
          resp.raise_for_status()
          print("텔레그램 알림 전송 완료")
          PY
