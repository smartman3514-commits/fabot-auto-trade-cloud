name: v2 시험 주문 (1주 사고 팔기, 시작 전 한 번만)

# 2026-10-15 인선 허락. 시험이 끝나면 이 파일은 지운다.
# 미국: 10-15 23:30 KST(14:30 UTC) / 국내: 10-16 10:30 KST(01:30 UTC) / SCHD: 10-16 23:30 KST — 자동매매 실행 시각과 겹치지 않게.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "us 또는 kr"
        required: true
        default: "us"
  schedule:
    - cron: "30 14 15 10 *"
    - cron: "30 1 16 10 *"
    - cron: "30 14 16 10 *"   # 10-16 23:30 KST — SCHD 시험(인선 요청)
    - cron: "30 14 19 10 *"   # 10-19 23:30 KST — SCHD 다시 시험(10-16은 키움 서버 응답 시간 초과)
    - cron: "30 14 22 10 *"   # 10-22 23:30 KST — QQQM 다시 시험(10-19 거절은 옛 816주 매수대금 미결제 탓, TQQQ 매도대금이 10-22 결제된 뒤)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Small test orders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIWOOM_PAPER_APP_KEY: ${{ secrets.KIWOOM_PAPER_APP_KEY }}
          KIWOOM_PAPER_APP_SECRET: ${{ secrets.KIWOOM_PAPER_APP_SECRET }}
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_MARKET: ${{ inputs.market }}
        run: |
          if [ -n "$INPUT_MARKET" ]; then M="$INPUT_MARKET"; elif [ "$(date -u +%H)" -ge 10 ]; then M=us; else M=kr; fi
          echo "시험 시장: $M"
          python -u v2_order_test.py --market "$M"
