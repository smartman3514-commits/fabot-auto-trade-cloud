name: 국내장 할 일 미리보기 (주문 없음)

# 키움 국내포트(fabot_kr.py)와 한투 v2 국내 칸(fabot_v2.py)이 '지금이 국내장 마감이라면' 무엇을 살지 계산만 한다.
# 두 스크립트 모두 --live 를 주지 않으면 주문을 내지 않는다(dry-run). 사람이 눌러야만 돈다.
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preview (no orders)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_STOCK: ${{ secrets.KIS_PAPER_STOCK }}
          KIWOOM_PAPER_APP_KEY: ${{ secrets.KIWOOM_PAPER_APP_KEY }}
          KIWOOM_PAPER_APP_SECRET: ${{ secrets.KIWOOM_PAPER_APP_SECRET }}
        run: |
          echo "===== 키움 국내포트 ====="
          python -u fabot_kr.py --market kr
          echo "===== 한투 v2 (국내 칸) ====="
          python -u fabot_v2.py --market kr
          echo "===== 연말 비중 맞추기 미리보기 (주문 없음) ====="
          python -u rebalance.py --write
          echo "===== 연말 비중 맞추기 리허설: 오늘을 실행일로 승인했다고 치고 dry-run (임시 폴더, 주문 없음) ====="
          export REBALANCE_PLAN_DIR="$RUNNER_TEMP/rb_rehearse"
          python -u rebalance.py --write --rehearse > /dev/null
          python -u fabot_kr.py --market kr
          python -u fabot_v2.py --market kr
          unset REBALANCE_PLAN_DIR

      - name: 계획 파일 보관(인선 확인용)
        uses: actions/upload-artifact@v4
        with:
          name: rebalance-plans
          path: rebalance_plans/
